<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SOLO12 BLE Controller</title>

  <style>
    :root {
      --btn-size: 92px;
      --gap: 10px;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      text-align: center;
      background: #111;
      color: #eee;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    body {
      padding: 18px;
    }

    h2 {
      margin: 8px 0 14px;
      font-size: 24px;
    }

    .top-bar, .test-row {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    button {
      border: none;
      border-radius: 16px;
      background: #2f2f2f;
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      padding: 14px 18px;
      min-width: 90px;
      min-height: 64px;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    button:active,
    button.active {
      background: #666;
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.45;
      transform: none;
    }

    .small {
      font-size: 16px;
      min-height: 46px;
      padding: 10px 14px;
      border-radius: 12px;
    }

    .connect {
      background: #1f6f3f;
    }

    .disconnect {
      background: #7a2e2e;
    }

    .stop {
      background: #a73333;
    }

    #status {
      margin: 10px auto;
      font-weight: 700;
      min-height: 24px;
    }

    #tx, #keys, #lastResult, #props {
      font-family: monospace;
      font-size: 15px;
      margin: 4px auto;
      min-height: 22px;
      overflow-wrap: anywhere;
    }

    .manual-box, .log-box {
      margin: 18px auto;
      max-width: 560px;
      padding: 14px;
      border: 1px solid #333;
      border-radius: 16px;
      background: #1a1a1a;
    }

    .manual-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    input, select {
      font-size: 18px;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #555;
      background: #0b0b0b;
      color: #fff;
    }

    input {
      flex: 1;
      min-width: 180px;
    }

    .hint {
      font-size: 13px;
      color: #aaa;
      margin-top: 8px;
    }

    #sendLog {
      text-align: left;
      font-family: monospace;
      font-size: 13px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-height: 180px;
      overflow-y: auto;
      margin-top: 8px;
      color: #ddd;
    }

    .controller {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 26px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .dpad {
      display: grid;
      grid-template-columns: var(--btn-size) var(--btn-size) var(--btn-size);
      grid-template-rows: var(--btn-size) var(--btn-size) var(--btn-size);
      gap: var(--gap);
      justify-content: center;
      align-items: center;
    }

    .dpad button {
      width: var(--btn-size);
      height: var(--btn-size);
      padding: 0;
      font-size: 34px;
    }

    .empty {
      width: var(--btn-size);
      height: var(--btn-size);
    }

    .rotation {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .rotation button {
      width: 115px;
      height: 82px;
      font-size: 34px;
    }

    .label {
      font-size: 13px;
      color: #aaa;
      font-weight: 500;
      margin-top: 4px;
    }

    .button-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    code {
      color: #ddd;
    }

    @media (max-width: 480px) {
      :root {
        --btn-size: 82px;
        --gap: 8px;
      }

      .controller {
        gap: 16px;
      }

      .rotation {
        flex-direction: row;
      }

      .rotation button {
        width: 96px;
        height: 76px;
      }
    }
  </style>
</head>

<body>
  <h2>SOLO12 BLE Controller</h2>

  <div class="top-bar">
    <button id="connectButton" class="small connect" onclick="connectBle()">Connect</button>
    <button id="disconnectButton" class="small disconnect" onclick="disconnectBle()" disabled>Disconnect</button>
    <button class="small stop" onclick="stopRobot()">STOP</button>
  </div>

  <div id="status" role="status">Disconnected</div>
  <div id="tx">TX: waiting</div>
  <div id="keys">Keys:</div>
  <div id="lastResult">Last write: none</div>
  <div id="props">RX properties: unknown</div>

  <div class="manual-box">
    <div><b>Manual Binary Send (Q0.7 values between -1.0 and 1.0)</b></div>

    <div class="manual-row">
      <input id="manualInput" type="text" placeholder="Example: 0, 0.5, -1">

      <select id="endingSelect">
        <option value="cr" selected>CR \r</option>
        <option value="lf">LF \n</option>
        <option value="crlf">CRLF \r\n</option>
        <option value="none">none</option>
      </select>

      <select id="writeModeSelect">
        <option value="auto" selected>Auto (prefer response)</option>
        <option value="withResponse">Write response</option>
        <option value="withoutResponse">Write no resp</option>
        <option value="legacy">Legacy write</option>
      </select>

      <button class="small" data-requires-connection onclick="sendManualBinary()" disabled>Send</button>
    </div>

    <div class="test-row">
      <button class="small" data-requires-connection onclick="testBinaryCommand(MOTION_LIMITS.vx.positive, 0, 0)" disabled>Test forward</button>
      <button class="small" data-requires-connection onclick="stopRobot()" disabled>Test stop (0.0)</button>
    </div>

    <div class="hint">
      Format envoyé : <code>%[X][Y][Z]%\r</code> où X, Y, Z sont convertis en virgule fixe <b>Q0.7</b> (1 octet chacun).
    </div>
  </div>

  <div class="controller">
    <div>
      <div class="dpad">
        <div class="empty"></div>

        <button data-key="z">
          <div class="button-content">
            ↑
            <span class="label">Front</span>
          </div>
        </button>

        <div class="empty"></div>

        <button data-key="q">
          <div class="button-content">
            ←
            <span class="label">Left</span>
          </div>
        </button>

        <button class="stop" onclick="stopRobot()">
          <div class="button-content">
            ■
            <span class="label">Stop</span>
          </div>
        </button>

        <button data-key="d">
          <div class="button-content">
            →
            <span class="label">Right</span>
          </div>
        </button>

        <div class="empty"></div>

        <button data-key="s">
          <div class="button-content">
            ↓
            <span class="label">Back</span>
          </div>
        </button>

        <div class="empty"></div>
      </div>
    </div>

    <div class="rotation">
      <button data-key="a">
        <div class="button-content">
          ↶
          <span class="label">Rot L</span>
        </div>
      </button>

      <button data-key="e">
        <div class="button-content">
          ↷
          <span class="label">Rot R</span>
        </div>
      </button>
    </div>
  </div>

  <div class="log-box">
    <b>Browser send log</b>
    <div id="sendLog">No writes yet.</div>
  </div>

<script src="controller.js"></script>
</body>
</html>
